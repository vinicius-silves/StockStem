<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

<div class="login">

    <h2>Entrar</h2>

    <form onsubmit="entrar(event)">

        <input
            type="email"
            id="email"
            placeholder="Digite seu email"
            required
        >

        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
        >

        <button type="submit">
            Entrar
        </button>

    </form>

    <p id="mensagem"></p>

</div>

<script src="script.js"></script>

</body>
</html>
